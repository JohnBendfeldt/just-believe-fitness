name: CI & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, Lint, Build & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run full test suite, linter, TypeScript check & production build
        run: npm run verify

      - name: Verify zero prohibited third-party branding terms
        run: |
          if grep -riE '(\botf\b|orangetheory|\bsplat\b|\bsplats\b|splatpoints)' src netlify index.html; then
            echo "Found prohibited branding term in source files!"
            exit 1
          fi
