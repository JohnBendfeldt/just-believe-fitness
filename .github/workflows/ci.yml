name: CI & Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite, linter, TypeScript check & production build
        run: npm run verify

      - name: Verify zero prohibited third-party branding terms
        run: |
          if grep -riE '(\botf\b|orangetheory|\bsplat\b|\bsplats\b|splatpoints)' src netlify index.html; then
            echo "Found prohibited branding term in source files!"
            exit 1
          fi
